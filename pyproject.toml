[project]
name = "taskr"
version = "0.1.0"
description = "taskr is an application that allows you to manage your tasks via the terminal."
readme = "README.md"
authors = [
    { name = "nisageze", email = "116450295+nisageze@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/nisageze/taskr"

[project.scripts]
taskr = "taskr.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.12"
strict = true
files = "src/taskr"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["A", "DTZ"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
